[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duoguard"
version = "2.0.0"
description = "DuoGuard research implementation with external labels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=1.5,<4", "scikit-learn>=1.2,<2", "torch>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
